name: Build EDVYNTRA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'edvyntra.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract project
        run: |
          unzip -q edvyntra.zip -d extracted
          echo "Project files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="extracted"
          # Use the directory containing package.json if the archive has a nested project folder.
          PACKAGE_JSON="$(find extracted -name package.json -not -path '*/node_modules/*' -print -quit || true)"
          if [ -n "$PACKAGE_JSON" ]; then
            ROOT="$(dirname "$PACKAGE_JSON")"
          fi
          echo "Project root: $ROOT"

          if [ -f "$ROOT/android/gradlew" ]; then
            cd "$ROOT/android"
            chmod +x gradlew
            ./gradlew assembleDebug
            APK_PATH="$(find app/build/outputs/apk -name '*.apk' -print -quit)"
          elif [ -f "$ROOT/gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
            APK_PATH="$(find . -path '*/build/outputs/apk/*' -name '*.apk' -print -quit)"
          else
            if [ ! -f "$ROOT/package.json" ]; then
              echo "No package.json or Android Gradle project found. The ZIP may need a different conversion process."
              exit 1
            fi

            cd "$ROOT"
            if [ -f bun.lock ] || [ -f bun.lockb ]; then
              bun install
            else
              npm install --legacy-peer-deps --no-audit --no-fund
            fi
            # Build web assets when a build script exists.
            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              bun run build
            fi

            # Locate the generated web app (common Vite/React/etc. output directories).
            WEB_DIR=""
            for d in dist build www; do
              if [ -d "$d" ]; then WEB_DIR="$d"; break; fi
            done
            if [ -z "$WEB_DIR" ]; then
              echo "Could not find dist/, build/, or www/ web output directory."
              echo "If this is already a native Android app, include its Gradle project in the ZIP."
              exit 1
            fi

            # Create a Capacitor Android shell around the built web application.
            bun add @capacitor/core @capacitor/cli @capacitor/android
            bunx cap init EDVYNTRA com.paoxlyyyy.edvyntra --web-dir "$WEB_DIR"
            bunx cap add android
            bunx cap sync android
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
            APK_PATH="$(find app/build/outputs/apk -name '*.apk' -print -quit)"
          fi

          if [ -z "${APK_PATH:-}" ] || [ ! -f "$APK_PATH" ]; then
            echo "APK build did not produce an APK."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/apk-output/EDVYNTRA-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDVYNTRA-APK
          path: apk-output/EDVYNTRA-debug.apk
          if-no-files-found: error
          retention-days: 14
